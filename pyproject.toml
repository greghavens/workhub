[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workhub"
version = "0.4.0"
description = "Approved GitHub work contracts for human-owned coding agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "mcp>=1.12,<2",
  "pathspec>=0.12,<1",
  "python-dotenv>=1,<2",
  "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
workhub = "workhub.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
